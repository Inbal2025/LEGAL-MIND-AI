<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<script>(function(){var t;try{t=localStorage.getItem("lm-theme")}catch(e){}if(t!=="light"&&t!=="dark"){t=window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"}document.documentElement.setAttribute("data-theme",t)})();</script>

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>פנייה ל-LEGAL MIND | האזור האישי</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&family=Frank+Ruhl+Libre:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/clients/portal.css?v=20261119f">
<style>
.narrow{max-width:860px}
.main{padding:clamp(24px,3.4vw,40px);margin-top:4px}
.mine{margin-top:clamp(40px,5vw,56px)}
.mine h2,.faq h2{font:600 18px var(--sans);color:var(--ink);margin:0 0 14px}
.tlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.tk{display:flex;flex-direction:column;gap:4px;padding:16px 18px;border-radius:18px;text-decoration:none;color:inherit;background:var(--soft-card);border:1px solid var(--line);transition:border-color .2s,transform .2s}
.tk:hover{border-color:var(--line-2);transform:translateY(-2px)}
.tk[aria-current="true"]{border-color:var(--teal)}
.tk .t1{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13.5px;color:var(--muted)}
.tk b{display:flex;align-items:center;gap:8px;color:var(--ink);font:500 17.5px/1.4 var(--head)}
.quiet{color:var(--muted);font-size:16px}
.thhead-back{display:inline-flex;align-items:center;gap:8px;margin-bottom:var(--s2);font:600 15.5px var(--sans);text-decoration:none}
.thhead-back .ico{width:18px;height:18px}
@media (max-width:600px){.tlist{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.tk{transition:none}.tk:hover{transform:none}}
.main h2{font-size:clamp(24px,2.4vw,30px);font-weight:400;line-height:1.3}
.form{display:flex;flex-direction:column;gap:var(--s3)}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cats label{cursor:pointer;position:relative}
.cats input{position:absolute;inset:0;width:1px;height:1px;margin:0;opacity:0;pointer-events:none}
.cats span{display:inline-block;padding:8px 14px;border-radius:var(--r-sm);border:1px solid var(--line-2);font:500 14.5px var(--sans);color:var(--body);transition:border-color .2s,color .2s,background .2s}
.cats span:hover{border-color:var(--teal);color:var(--hi)}
.cats input:checked+span{background:rgba(var(--teal-rgb),.1);border-color:var(--teal);color:var(--hi)}
.cats input:focus-visible+span{outline:2px solid var(--teal);outline-offset:2px}
.sendrow{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap}
.promise{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:14px}
.done{text-align:center;padding:clamp(24px,4vw,48px) 10px}
.done .check{width:56px;height:56px;border-radius:50%;margin:0 auto var(--s3);display:grid;place-items:center;border:1px solid var(--teal);color:var(--teal)}
.done .check svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.done .ref{display:block;margin:var(--s3) 0 4px;font:300 44px/1 var(--head);color:var(--ink);letter-spacing:.04em}
.done .refl{font-size:13px;color:var(--muted)}
.done p{max-width:46ch;margin:var(--s3) auto 0}
.done .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:var(--s4)}
.th-head{padding-bottom:var(--s3);margin-bottom:var(--s3);border-bottom:1px solid var(--line)}
.th-head .sub{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:14px}
.note{padding:14px 16px;border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--line);font-size:14.5px;margin-top:var(--s2)}
.faq{margin:clamp(40px,5vw,56px) 0 96px}
.faq .qs{border-top:1px solid var(--line)}
.faq .lbl{font:600 14px var(--sans);color:var(--muted);margin:var(--s3) 0 var(--s1)}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:var(--s2);padding:16px 2px;cursor:pointer;color:var(--ink);font:500 17px var(--sans)}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"";flex:none;width:8px;height:8px;border-inline-start:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(-45deg);transition:transform .2s;margin-inline-end:4px}
.faq details[open] summary::after{transform:rotate(135deg)}
.faq details p{margin:0 0 16px;color:var(--body);font-size:15.5px;max-width:58ch}
.empty-state{padding:clamp(24px,4vw,48px) 4px;max-width:520px}
.empty-state h2{margin-bottom:10px}
.empty-state p{margin:0;color:var(--body)}
</style>
</head>
<body dir="rtl">
<div class="demo hide" id="demo">תצוגת דוגמה: הפניות בדף הזה אינן אמיתיות, ושום דבר לא נשלח.</div>
<header class="top"></header>
<main class="wrap narrow">
  <a class="back t-clay" id="back" href="/clients/home.html"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>חזרה לדף הבית</a>
  <div class="sec-head t-clay"><span class="tb" id="secIco"></span><div><h1>יש שאלה? כתבו לנו</h1><p>הפנייה מגיעה ישירות לצוות שמלווה את המשרד. עונים תוך יום עסקים אחד.</p></div></div>
  <section class="main card" id="main" aria-live="polite"></section>
  <section class="mine" id="mine" aria-labelledby="h-mine"><h2 id="h-mine">הפניות שלי</h2><div class="tlist" id="list"></div></section>
  <section class="faq" id="faq" aria-labelledby="h-faq"><h2 id="h-faq">שאלות שחוזרות</h2><div class="qs" id="faqList"></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/clients/portal.js?v=20261119f"></script>
<script>
(async function () {
  var $ = function (id) { return document.getElementById(id); }, E = LM.esc, T = LM.TICKET;
  var me = await LM.requireMember(); if (!me) return;
  if (LM.MOCK) $('demo').classList.remove('hide');
  LM.header(me, 'support');
  $('back').href = LM.link('/clients/home.html'); $('secIco').innerHTML = LM.ICONS.chat;

  var tickets = [];
  var mockThreads = JSON.parse(JSON.stringify(LM.MOCKDATA.threads));
  async function loadList() {
    tickets = LM.MOCK ? LM.MOCKDATA.tickets : (((await LM.rpc('portal_tickets')).data) || []);
    drawList();
    LM.setUnread(tickets.filter(function (t) { return t.unread; }).length);
  }
  function chip(st) { return '<span class="chip st-' + E(st) + '">' + E(T.status[st] || st) + '</span>'; }
  function drawList() {
    var cur = (location.hash.match(/ticket=([\w-]+)/) || [])[1];
    $('list').innerHTML = tickets.length ? tickets.map(function (t) {
      return '<a class="tk" href="#ticket=' + E(t.ref) + '" aria-current="' + (t.ref === cur) + '"><span class="t1"><span dir="ltr">' + E(t.ref) + '</span>' + chip(t.status) + '</span><b>' + (t.unread ? '<span class="dot" title="תשובה חדשה"></span>' : '') + E(t.subject) + '</b><span class="t1">' + E(LM.when(t.updated_at)) + '</span></a>';
    }).join('') : '<p class="quiet">עוד לא נפתחו פניות. כשתשלחו פנייה, היא תופיע כאן עם התשובה.</p>';
  }

  function newForm() {
    var cats = Object.keys(T.categories).map(function (k, i) {
      return '<label><input type="radio" name="category" value="' + k + '"' + (i === 0 ? ' checked' : '') + '><span>' + E(T.categories[k]) + '</span></label>';
    }).join('');
    var FAQ = [
      ['Claude לא מוצא קובץ שהעליתי', 'כדאי לבדוק שהקובץ עלה לשיחה הנוכחית או לפרויקט הנכון, ושהוא לא גדול מדי. קבצים סרוקים כתמונה עובדים טוב יותר אחרי המרה ל-PDF עם טקסט.'],
      ['הקונקטור של נבו לא מופיע', 'פותחים את Claude, נכנסים להגדרות ואז ל-Connectors. אם נבו לא ברשימה, אפשר לפתוח פנייה ונחבר אותו יחד בשיחה קצרה.'],
      ['איך מתקינים סקיל מהספרייה', 'מורידים את הקובץ מהספרייה, נכנסים בהגדרות של Claude ליכולות, ומעלים אותו באזור הסקילים. בכל סקיל בספרייה יש הסבר בשלושה צעדים.'],
      ['מישהו חדש הצטרף לצוות', 'הנהלת המשרד יכולה לבקש הוספה בפנייה מסוג אחר. נוסיף את הכתובת, והקישור לכניסה יישלח ישירות למייל.']
    ];
    $('faqList').innerHTML = FAQ.map(function (q) { return '<details><summary><span>' + E(q[0]).replace(/(Claude|Connectors)/g, '<span dir="ltr">$1</span>') + '</span></summary><p>' + E(q[1]).replace(/(Claude|Connectors|PDF)/g, '<span dir="ltr">$1</span>') + '</p></details>'; }).join('');
    $('main').innerHTML = '<h2>פנייה חדשה</h2><p class="muted" style="margin:6px 0 var(--s3)">כמה שורות מספיקות. אם יש צילום מסך או מסמך, אפשר לצרף אותו.</p>'
      + '<form class="form" id="f" novalidate>'
      + '<div class="field"><label>במה מדובר?</label><div class="cats" role="radiogroup">' + cats + '</div></div>'
      + '<div class="field"><label for="sub">נושא</label><input id="sub" name="subject" dir="rtl" maxlength="160" required placeholder="למשל: הקונקטור של נבו לא מופיע אצל אחת העובדות"></div>'
      + '<div class="field"><label for="body">מה קורה?</label><textarea id="body" name="body" maxlength="8000" required placeholder="ספרו לנו מה ניסיתם, מה קרה, ומה הייתם רוצים שיקרה."></textarea></div>'
      + '<label class="filebtn"><input type="file" id="file" accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.png,.jpg,.jpeg,.txt,.zip">' + LM.ICONS.clip + '<span id="fileName">צירוף קובץ, עד 10MB</span></label>'
      + '<div class="sendrow"><button class="btn btn-gold" id="send">שליחת הפנייה</button><span class="promise"><span class="dot"></span>נחזור אליכם תוך יום עסקים אחד.</span></div>'
      + '<p class="msg" id="msg" role="status"></p></form>';
    $('file').addEventListener('change', function () { $('fileName').textContent = this.files[0] ? this.files[0].name : 'צירוף קובץ, עד 10MB'; });
    $('f').addEventListener('submit', async function (e) {
      e.preventDefault();
      var subject = $('sub').value.trim(), body = $('body').value.trim(), category = (new FormData(this)).get('category');
      if (subject.length < 2 || body.length < 2) { $('msg').className = 'msg err'; $('msg').textContent = 'חסר נושא או תיאור קצר.'; return; }
      $('send').disabled = true; $('msg').className = 'msg'; $('msg').textContent = 'שולחים...';
      try {
        var att = await LM.upload('tickets', $('file').files[0]);
        var ref;
        if (LM.MOCK) {
          ref = 'LM-1005';
          LM.MOCKDATA.tickets.unshift({ ref: ref, subject: subject, category: category, status: 'open', created_at: new Date().toISOString(), updated_at: new Date().toISOString(), unread: false });
          mockThreads[ref] = [{ id: 99, author_type: 'client', author_name: me.full_name, body: body, created_at: new Date().toISOString(), attachment_name: att.name, has_file: !!att.name }];
        } else {
          var r = await LM.fn('tickets', { action: 'create', category: category, subject: subject, body: body, attachment_path: att.path, attachment_name: att.name });
          if (r.error || !r.data || !r.data.ok) throw new Error((r.data && r.data.error) || 'השליחה לא הצליחה');
          ref = r.data.ref;
        }
        await loadList(); done(ref);
      } catch (err) { $('send').disabled = false; $('msg').className = 'msg err'; $('msg').textContent = err.message + '. אפשר לנסות שוב.'; }
    });
  }

  function done(ref) {
    history.replaceState(null, '', '#sent=' + ref);
    $('main').innerHTML = '<div class="done"><div class="check"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>'
      + '<h2>תודה, הפנייה אצלנו.</h2><span class="ref" dir="ltr">' + E(ref) + '</span><span class="refl">מספר הפנייה</span>'
      + '<p>הצוות שמלווה את המשרד כבר קיבל אותה. נחזור אליכם תוך יום עסקים אחד, התשובה תופיע כאן, ונשלח לכם גם מייל קצר כשהיא מגיעה.</p>'
      + '<div class="acts"><a class="btn btn-gold" href="#ticket=' + E(ref) + '">לצפייה בפנייה</a><a class="btn btn-ghost" href="' + LM.link('/clients/home.html') + '">חזרה לאזור האישי</a></div></div>';
  }

  async function showTicket(ref) {
    $('main').innerHTML = '<p class="muted">טוען...</p>';
    var t;
    if (LM.MOCK) {
      var head = tickets.find(function (x) { return x.ref === ref; });
      if (head) { head.unread = false; t = Object.assign({}, head, { messages: mockThreads[ref] || [], can_reopen: head.status !== 'closed' || Date.now() - Date.parse(head.updated_at) < 14 * 86400000 }); }
    } else {
      t = (await LM.rpc('portal_ticket', { p_ref: ref })).data;
      var row = tickets.find(function (x) { return x.ref === ref; }); if (row) row.unread = false;
    }
    drawList();
    if (!t) { $('main').innerHTML = '<div class="empty-state"><h2>הפנייה לא נמצאה.</h2><p>ייתכן שהקישור ישן. הפניות שלכם מופיעות ברשימה.</p></div>'; return; }
    var msgs = (t.messages || []).map(function (m) {
      if (m.author_type === 'system') return '<div class="sys">' + E(m.body) + ' · ' + E(LM.when(m.created_at)) + '</div>';
      var mine = m.author_type === 'client';
      return '<div class="bub ' + (mine ? 'client' : 'staff') + '"><div class="meta"><b>' + E(m.author_name || (mine ? me.full_name : 'LEGAL MIND')) + '</b>' + (mine ? '' : '<span>LEGAL MIND</span>') + '<span>' + E(LM.when(m.created_at)) + '</span></div>' + E(m.body)
        + (m.has_file ? '<div><button class="att" type="button" data-file="' + E(m.id) + '">' + LM.ICONS.clip + E(m.attachment_name || 'קובץ מצורף') + '</button></div>' : '') + '</div>';
    }).join('');
    var closed = t.status === 'closed';
    var composer = (closed && !t.can_reopen)
      ? '<div class="note">הפנייה נסגרה לפני יותר מ-14 יום. אם יש משהו חדש, נשמח לקבל <a href="#new">פנייה חדשה</a>.</div>'
      : '<form class="composer" id="rf">' + (closed ? '<div class="note" style="margin:0">הפנייה סגורה. אם משהו עדיין לא מסתדר, כתבו כאן והיא תיפתח מחדש.</div>' : '')
        + '<textarea id="rb" maxlength="8000" placeholder="כתבו תשובה..." aria-label="תשובה"></textarea>'
        + '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap"><label class="filebtn"><input type="file" id="rfile" accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.png,.jpg,.jpeg,.txt,.zip"><span id="rfn">צירוף קובץ</span></label>'
        + '<span style="display:flex;gap:10px;flex-wrap:wrap">' + (closed ? '' : '<button class="btn btn-ghost" type="button" id="resolve">העניין הסתדר, אפשר לסגור</button>') + '<button class="btn btn-gold" id="rs">' + (closed ? 'שליחה ופתיחה מחדש' : 'שליחה') + '</button></span></div><p class="msg" id="rmsg" role="status"></p></form>';
    $('main').innerHTML = '<a class="thhead-back" href="#new">' + LM.ICONS.back + 'לפנייה חדשה</a><div class="th-head"><div><h2>' + E(t.subject) + '</h2><div class="sub"><span dir="ltr">' + E(ref) + '</span>' + chip(t.status) + '<span>' + E(T.categories[t.category] || '') + '</span></div></div></div>'
      + '<div class="thread">' + msgs + '</div>' + composer;
    $('main').querySelectorAll('[data-file]').forEach(function (b) {
      b.addEventListener('click', async function () {
        if (LM.MOCK) { alert('בתצוגת הדוגמה אין קובץ אמיתי.'); return; }
        var r = await LM.fn('tickets', { action: 'file_url', message_id: Number(b.getAttribute('data-file')) });
        if (r.data && r.data.url) location.href = r.data.url;
      });
    });
    if ($('rfile')) $('rfile').addEventListener('change', function () { $('rfn').textContent = this.files[0] ? this.files[0].name : 'צירוף קובץ'; });
    if ($('resolve')) $('resolve').addEventListener('click', async function () {
      if (LM.MOCK) { var x = tickets.find(function (z) { return z.ref === ref; }); x.status = 'closed'; x.updated_at = new Date().toISOString(); (mockThreads[ref] = mockThreads[ref] || []).push({ author_type: 'system', body: me.full_name + ' סימנו שהפנייה נפתרה.', created_at: new Date().toISOString() }); }
      else await LM.rpc('portal_ticket_resolve', { p_ref: ref });
      await loadList(); showTicket(ref);
    });
    if ($('rf')) $('rf').addEventListener('submit', async function (e) {
      e.preventDefault();
      var body = $('rb').value.trim(); if (!body) return;
      $('rs').disabled = true; $('rmsg').className = 'msg'; $('rmsg').textContent = 'שולחים...';
      try {
        var att = await LM.upload('tickets', $('rfile').files[0]);
        if (LM.MOCK) {
          var x = tickets.find(function (z) { return z.ref === ref; }); if (x.status === 'closed') (mockThreads[ref] = mockThreads[ref] || []).push({ author_type: 'system', body: 'הפנייה נפתחה מחדש.', created_at: new Date().toISOString() });
          x.status = 'open'; x.updated_at = new Date().toISOString();
          (mockThreads[ref] = mockThreads[ref] || []).push({ id: Date.now(), author_type: 'client', author_name: me.full_name, body: body, created_at: new Date().toISOString(), attachment_name: att.name, has_file: !!att.name });
        } else {
          var r = await LM.fn('tickets', { action: 'reply', ref: ref, body: body, attachment_path: att.path, attachment_name: att.name });
          if (r.data && r.data.error === 'reopen_expired') throw new Error('הפנייה נסגרה לפני יותר מ-14 יום. פתחו פנייה חדשה');
          if (r.error || !r.data || !r.data.ok) throw new Error('השליחה לא הצליחה');
        }
        await loadList(); showTicket(ref);
      } catch (err) { $('rs').disabled = false; $('rmsg').className = 'msg err'; $('rmsg').textContent = err.message + '.'; }
    });
  }

  function route() {
    var h = location.hash;
    var m = h.match(/ticket=([\w-]+)/);
    $('faq').hidden = !!m;
    if (m) { showTicket(m[1].toUpperCase()); window.scrollTo(0, 0); return; }
    var s = h.match(/sent=([\w-]+)/);
    if (s) return done(s[1]);
    drawList(); newForm();
    if (h === '#mine') $('mine').scrollIntoView();
  }
  window.addEventListener('hashchange', route);
  await loadList(); route();
})();
</script>
</body>
</html>
