    if (sec.kind === 'skill' && list.length) { drawSkills(sec, list); return; }
    var cards = list.map(function (i) {
      if (i.kind === 'prompt') return '<div class="tile pr ' + sec.tone + '"><span class="tt">' + E(i.title) + '</span><span class="td">' + E(i.desc) + '</span><button class="copy" type="button" data-copy="' + E(i.id) + '" aria-label="העתקת הפרומפט: ' + E(i.title) + '">' + I.copy + '<span>העתקה</span></button></div>';
      var facts = [];
      if (i.kind === 'video' && i.duration_sec) facts.push('<span dir="ltr">' + LM.dur(i.duration_sec) + '</span> דקות');
      if (i.kind === 'booklet') { if (i.pages) facts.push(i.pages + ' עמודים'); if (i.updated_at) facts.push('עודכנה ' + D(i.updated_at)); }
      if (i.kind === 'skill') facts.push('הורדה והתקנה בשלושה צעדים');
      return '<button class="tile ' + sec.tone + '" type="button" data-id="' + E(i.id) + '">' + (i.is_new ? '<span class="new">חדש</span>' : '') + '<span class="tb">' + (I[i.kind] || I.booklet) + '</span><span class="tt">' + E(i.title) + '</span><span class="td">' + E(i.desc) + '</span>' + (facts.length ? '<span class="tc">' + facts.join(' · ') + '</span>' : '') + '</button>';
    }).join('');
    $('view').innerHTML = '<div class="sec-head ' + sec.tone + '"><span class="tb">' + I[sec.kind] + '</span><div><h1>' + sec.title + '</h1><p>' + (list.length ? LM.countText(sec, list.length) : sec.line) + '</p></div></div>'
      + (list.length ? '<div class="items">' + cards + '</div>' : '<div class="calm-empty"><b>' + sec.soon + '…</b>כשיעלה משהו חדש, הוא יופיע כאן. בינתיים אפשר <a href="' + LM.link('/clients/support.html') + '#new">לכתוב לנו</a>.</div>');
  }

  // ---- skills: one row per skill, grouped; the skill itself runs in Claude through the LEGAL MIND connector
  var SKQ = '', SKG = 'top';
  function drawSkills(sec, list) {
    list = list.slice().sort(function (a, b) { return (a.sort || 999) - (b.sort || 999); });
    var ORDER = ['חוזים והסכמים', 'נדל"ן', 'ליטיגציה', 'מכתבים, מסמכים וצוואות', 'ניהול משרד', 'עבודה עם Word', 'שיווק ותוכן', 'כללי'];
    var groups = []; list.forEach(function (i) { if (groups.indexOf(i.topic) < 0) groups.push(i.topic); });
    groups.sort(function (a, b) { var x = ORDER.indexOf(a), y = ORDER.indexOf(b); return (x < 0 ? 99 : x) - (y < 0 ? 99 : y); });
    var topN = list.filter(function (i) { return i.top; }).length;
    var chips = [{ k: 'top', t: 'הכי שימושיים', n: topN }].concat(groups.map(function (g) { return { k: g, t: g, n: list.filter(function (i) { return i.topic === g; }).length }; }), [{ k: 'all', t: 'הכול', n: list.length }]);
    $('view').innerHTML = '<div class="sec-head ' + sec.tone + '"><span class="tb">' + I.skill + '</span><div><h1>הסקילים של המשרד</h1><p>' + list.length + ' סקילים, עם חוברת הדרכה לכל סקיל</p></div></div>'
      + '<div class="sk-intro"><span class="sk-on"><i></i>פעילים אצלכם ב-<span dir="ltr">Claude</span></span><span class="sk-how">אין מה להתקין. כותבים ל-<span dir="ltr">Claude</span> כרגיל, או מקלידים <kbd>/</kbd> ובוחרים את הסקיל.</span></div>'
      + '<input class="sk-search" id="skq" type="search" placeholder="מה צריך לעשות? למשל: להשוות טיוטות" aria-label="חיפוש סקיל" value="' + E(SKQ) + '">'
      + '<div class="sk-chips" role="group" aria-label="סינון לפי תחום">' + chips.map(function (c) { return '<button type="button" data-g="' + E(c.k) + '" aria-pressed="' + (SKG === c.k) + '">' + E(c.t) + '<span class="n">' + c.n + '</span></button>'; }).join('') + '</div>'
      + '<div id="sklist"></div>';
    var row = function (i) {
      var slash = 'legalmind-' + i.id.replace(/^s-/, '');
      return '<div class="sk-row"><button class="sk-head" type="button" aria-expanded="false"><span class="sk-ic">' + I.skill + '</span><span class="sk-tx"><b>' + E(i.title) + '</b><span>' + E(i.desc) + '</span></span>' + (i.top && SKG !== 'top' ? '<span class="sk-top">★ שימושי</span>' : '') + '<svg class="sk-chev ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>'
        + '<div class="sk-body"><div class="sk-say">כותבים ל-<span dir="ltr">Claude</span>:<q>' + E(i.body || '') + '</q><button class="copy" type="button" data-copy="' + E(i.id) + '">' + I.copy + '<span>העתקה</span></button><div class="sl">או בוחרים אותו בעצמכם: מקלידים <code>/' + E(slash) + '</code></div></div>'
        + '<div class="sk-acts">' + (i.pages ? '<button class="btn btn-gold" type="button" data-book="' + E(i.id) + '">פתיחת חוברת ההדרכה · ' + i.pages + ' עמודים</button>' : '<span class="muted" style="font-size:14px">חוברת ההדרכה תעלה בקרוב</span>') + '</div></div></div>';
    };
    function fill() {
      var q = SKQ.trim(), L;
      if (q) { var w = q.split(/\s+/); L = list.filter(function (i) { var t = i.title + ' ' + i.desc + ' ' + (i.body || '') + ' ' + i.topic; return w.every(function (x) { return t.indexOf(x) >= 0; }); }); }
      else L = SKG === 'top' ? list.filter(function (i) { return i.top; }) : SKG === 'all' ? list : list.filter(function (i) { return i.topic === SKG; });
      var html;
      if (!L.length) html = '<div class="sk-list"><div class="sk-none">לא נמצא סקיל כזה. נסו מילה אחרת, או <a href="' + LM.link('/clients/support.html') + '#new">כתבו לנו</a> ונבנה אותו.</div></div>';
      else if (!q && SKG === 'all') html = groups.map(function (g) { var x = L.filter(function (i) { return i.topic === g; }); return x.length ? '<section class="sk-group"><h2>' + E(g) + '</h2><div class="sk-list">' + x.map(row).join('') + '</div></section>' : ''; }).join('');
      else html = '<div class="sk-list">' + L.map(row).join('') + '</div>';
      $('sklist').innerHTML = html;
    }
    fill();
    $('skq').addEventListener('input', function () { SKQ = this.value; fill(); });
    $('view').querySelector('.sk-chips').addEventListener('click', function (e) {
      var b = e.target.closest('[data-g]'); if (!b) return; SKG = b.getAttribute('data-g'); SKQ = ''; $('skq').value = '';
      this.querySelectorAll('[data-g]').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); }); fill();
    });
    $('sklist').addEventListener('click', function (e) {
      if (e.target.closest('[data-copy]')) return;   // copy is handled by the page-wide listener
      var bk = e.target.closest('[data-book]'); if (bk) { open(bk.getAttribute('data-book')); return; }
      var h = e.target.closest('.sk-head'); if (!h) return;
      var r = h.parentNode, on = !r.classList.contains('open'); r.classList.toggle('open', on); h.setAttribute('aria-expanded', String(on));
    });
  }
  window.addEventListener('hashchange', function () { draw(); window.scrollTo(0, 0); });
  draw();

  // ---- viewer: content only through a 1-hour signed link (protections 10, 11, 12, 13)
  var V = $('viewer'), VB = $('vBody');
  V.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('keydown', function (e) {
    if (V.classList.contains('hide')) return;
    if (e.key === 'Escape') close();
    if ((e.ctrlKey || e.metaKey) && /^[sp]$/i.test(e.key)) e.preventDefault();
  });
  function close() { V.classList.add('hide'); VB.innerHTML = ''; var w = V.querySelector(':scope > .wm'); if (w) w.remove(); }
  $('vClose').addEventListener('click', close);

  function stamp(ctx, w, h) {
    ctx.save(); ctx.globalAlpha = .13; ctx.fillStyle = '#0B1C28'; ctx.font = '700 ' + Math.round(w / 42) + 'px Assistant, sans-serif'; ctx.direction = 'rtl';
    var t = me.full_name + ' · ' + me.office_name;
    ctx.translate(w / 2, h / 2); ctx.rotate(-0.42);
    for (var y = -h; y < h; y += h / 7) for (var x = -w; x < w; x += w / 2.2) ctx.fillText(t, x, y);
    ctx.restore();
  }

  // ---- video player: opens at 70% of the screen, one button toggles full screen and back
  var VM = $('vmodal'), VS = $('vmStage'), VSZ = $('vmSize');
  function vmSize(full) {
    VM.classList.toggle('full', full);
    VSZ.querySelector('.lbl').textContent = full ? 'הקטנה' : 'מסך מלא';
    VSZ.setAttribute('aria-label', full ? 'הקטנה ל-70% מהמסך' : 'הגדלה למסך מלא');
    VSZ.querySelector('path').setAttribute('d', full ? 'M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5' : 'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5');
    try {
      if (full && !document.fullscreenElement && VM.requestFullscreen) VM.requestFullscreen().catch(function () {});
      if (!full && document.fullscreenElement) document.exitFullscreen().catch(function () {});
    } catch (e) {}
  }
  function vmClose() { if (document.fullscreenElement) document.exitFullscreen().catch(function () {}); VM.classList.add('hide'); VM.classList.remove('full'); VS.innerHTML = ''; }
  VSZ.addEventListener('click', function () { vmSize(!VM.classList.contains('full')); });
  $('vmClose').addEventListener('click', vmClose);
  VM.addEventListener('click', function (e) { if (e.target === VM) vmClose(); });
  VM.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('fullscreenchange', function () { if (!document.fullscreenElement && VM.classList.contains('full')) vmSize(false); });
  document.addEventListener('keydown', function (e) { if (!VM.classList.contains('hide') && e.key === 'Escape' && !document.fullscreenElement) vmClose(); });
  function openDoc(it) {   // public guide (also on the site): read it here, inside the client area
    $('vmTitle').textContent = it.title; VM.classList.add('doc'); vmSize(false); VM.classList.remove('hide');
    VS.innerHTML = '<iframe src="' + E(it.pub) + '" title="' + E(it.title) + '"></iframe>';
    $('vmClose').focus();
    if (!LM.MOCK) LM.rpc('portal_progress', { p_item: it.id, p_progress: Math.max(it.progress || 0, 0.1) });
  }
  async function openVideo(it) {
    VM.classList.remove('doc');
    $('vmTitle').textContent = it.title; vmSize(false); VM.classList.remove('hide');
    VS.innerHTML = '<p style="color:#cfd8dc;text-align:center;padding-top:20%">טוען את הסרטון...</p>';
    if (it.pub) {   // public video (also on the site and YouTube): no signed link needed
      VS.innerHTML = /^https:\/\/www\.youtube-nocookie\.com\//.test(it.pub)
        ? '<iframe src="' + E(it.pub) + '" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen title="' + E(it.title) + '"></iframe>'
        : '<video src="' + E(it.pub) + '" controls autoplay playsinline controlslist="nodownload" style="position:absolute;inset:0;width:100%;height:100%;background:#000"></video>';
      $('vmClose').focus();
      LM.rpc('portal_progress', { p_item: it.id, p_progress: Math.max(it.progress || 0, 0.1) });
      return;
    }
    var r = await LM.fn('sign-url', { item_id: it.id, device: LM.deviceId() });
    if (r.error || !r.data || !r.data.url) { VS.innerHTML = '<p class="msg err" style="margin:20% auto 0;max-width:420px;text-align:center">לא הצלחנו לפתוח את הסרטון. נסו שוב, או פתחו פנייה ל-LEGAL MIND.</p>'; return; }
    VS.innerHTML = '<iframe src="' + E(r.data.url) + '" allow="autoplay; fullscreen" allowfullscreen title="' + E(it.title) + '"></iframe><div class="shield" aria-hidden="true"></div>';
    LM.watermark(me, VS);
    $('vmClose').focus();
    LM.rpc('portal_progress', { p_item: it.id, p_progress: Math.max(it.progress || 0, 0.1) });
  }

  async function open(id) {
    var it = items.find(function (i) { return i.id === id; }); if (!it) return;
    if (it.kind === 'video' && !LM.MOCK) { openVideo(it); return; }
    if (it.kind === 'booklet' && it.pub) { openDoc(it); return; }
    $('vTitle').textContent = it.title; VB.innerHTML = '<p class="muted">טוען...</p>'; V.classList.remove('hide');
    if (it.kind === 'prompt') {
      VB.innerHTML = '<div class="card skillbox promptbox t-gold"><h3>' + E(it.title) + '</h3><p style="margin:0">' + E(it.desc) + '</p><pre>' + E(it.body || '') + '</pre><button class="copy" type="button" data-copy="' + E(it.id) + '">' + LM.ICONS.copy + '<span>העתקה</span></button></div>';
      VB.querySelector('[data-copy]').addEventListener('click', function () { copyPrompt(this, it.id); });
      return;
    }
    LM.watermark(me, V);   // personal watermark over the content only (protection 13)
    if (LM.MOCK) {
      VB.innerHTML = it.kind === 'video'
        ? '<div class="player">כאן ינוגן הסרטון בנגן הפרטי, עם השם והמשרד שלכם עליו.<br>תצוגת דוגמה.</div>'
        : '<p class="muted">כאן ייפתחו עמודי החוברת לקריאה, בלי הורדה ועם סימן מים אישי. תצוגת דוגמה.</p>';
      return;
    }
    var r = await LM.fn('sign-url', { item_id: id, device: LM.deviceId() });
    if (r.error || !r.data || !r.data.url) { VB.innerHTML = '<p class="msg err">לא הצלחנו לפתוח את הפריט. נסו שוב, או פנו למלווה של המשרד.</p>'; return; }
    if (it.kind === 'video') {
      VB.innerHTML = '<div class="player"><iframe src="' + E(r.data.url) + '" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen title="' + E(it.title) + '"></iframe></div>';
    } else {
      VB.innerHTML = '';
      var pdf = await pdfjsLib.getDocument({ url: r.data.url, disableAutoFetch: true }).promise;
      for (var n = 1; n <= pdf.numPages; n++) {
        var page = await pdf.getPage(n), vp = page.getViewport({ scale: 1.6 });
        var cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height; VB.appendChild(cv);
        var ctx = cv.getContext('2d'); await page.render({ canvasContext: ctx, viewport: vp }).promise; stamp(ctx, vp.width, vp.height);
      }
    }
    LM.rpc('portal_progress', { p_item: id, p_progress: Math.max(it.progress || 0, 0.1) });
  }
  if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  async function copyPrompt(btn, id) {
    var it = byId[id]; if (!it) return;
    var ok = await LM.copyText(it.body || it.desc || '');
    var lbl = btn.querySelector('span'); lbl.textContent = ok ? 'הועתק' : 'לא הועתק'; btn.classList.toggle('done', ok);
    clearTimeout(btn._t); btn._t = setTimeout(function () { lbl.textContent = 'העתקה'; btn.classList.remove('done'); }, 2200);
    if (ok) LM.rpc('portal_progress', { p_item: id, p_progress: 1 });
  }
  $('view').addEventListener('click', function (e) {
    var cp = e.target.closest('[data-copy]'); if (cp) { copyPrompt(cp, cp.getAttribute('data-copy')); return; }
    var c = e.target.closest('[data-id]'); if (c) open(c.getAttribute('data-id'));
  });
  var want = new URLSearchParams(location.search).get('open');
  if (want && byId[want]) { var ws = SEC.find(function (x) { return x.kind === byId[want].kind; }); if (ws && location.hash !== '#' + ws.hash) { history.replaceState(null, '', location.pathname + location.search + '#' + ws.hash); draw(); } open(want); }
})();
</script>
</body>
