.tabs button[aria-selected="true"]{transform:translateY(3px);box-shadow:inset 0 2px 6px rgba(0,0,0,.12),0 1px 0 var(--te);outline:2px solid var(--tk);outline-offset:3px}
.tabs .badge{background:var(--te);color:var(--tk)}

table{width:100%;border-collapse:collapse;font-size:15px}

td{color:var(--body);font-variant-numeric:tabular-nums}

.quiet{color:var(--muted);font-size:15px;padding:var(--s2) 0}
.sub-h{font-size:21px;margin:32px 0 var(--s2)}
td.acts{white-space:nowrap}
.edit-row .row-form{margin:0}
tr.hide{display:none}
.inbox{display:grid;grid-template-columns:340px minmax(0,1fr);gap:var(--s4);align-items:start}
.ifl{display:flex;gap:2px;flex-wrap:wrap;margin-bottom:var(--s2)}
.ifl button{border:0;background:transparent;color:var(--muted);border-radius:8px;padding:6px 10px;font:500 14px var(--sans);cursor:pointer}
.ifl button:hover{color:var(--hi)}

.ilist{list-style:none;margin:0;padding:0;border-top:1px solid var(--line);max-height:72vh;overflow:auto}

.ilist .r1{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted)}
.ilist b{display:flex;align-items:center;gap:8px;color:var(--ink);font:500 16px/1.4 var(--head);margin:5px 0 4px}
.idet{min-height:420px;padding:clamp(20px,3vw,32px)}
.idet .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s2);flex-wrap:wrap;padding-bottom:var(--s3);margin-bottom:var(--s3);border-bottom:1px solid var(--line)}

.ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ctl select{background:var(--input-bg);border:1px solid var(--line-2);border-radius:8px;color:var(--ink);font:500 14px var(--sans);padding:7px 10px;direction:rtl}
.mode{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:10px;align-self:flex-start}

.mode button.note[aria-pressed="true"]{background:rgba(var(--gold-rgb),.18);color:var(--gold)}
@media (max-width:980px){.inbox{grid-template-columns:1fr}}
</style>

    staff: [{ id: 'a1', name: 'עו״ד אסף אברמזון' }, { id: 'a2', name: 'עו״ד רועי נימצוביץ׳' }],
    rows: [
      { ref: 'LM-1005', subject: 'איך מוסיפים עובדת חדשה לאזור האישי?', category: 'שאלה על כלי', status: 'open', who: 'יואב כהן', office: 'משרד דוגמה ב׳', assignee: '', updated_at: new Date(Date.now() - 1800000).toISOString(), unread: true },
      { ref: 'LM-1004', subject: 'הקונקטור של נבו לא מופיע אצל אחת העובדות', category: 'בעיה טכנית', status: 'waiting_client', who: 'דנה לוי', office: 'משרד לדוגמה ושות׳', assignee: 'עו״ד אסף אברמזון', updated_at: new Date(Date.now() - 3600000 * 3).toISOString(), unread: false },
      { ref: 'LM-1003', subject: 'בקשה לסקיל שמסכם פרוטוקולים של דיונים', category: 'בקשה לסקיל או תבנית', status: 'in_progress', who: 'דנה לוי', office: 'משרד לדוגמה ושות׳', assignee: 'עו״ד רועי נימצוביץ׳', updated_at: new Date(Date.now() - 86400000).toISOString(), unread: false },
      { ref: 'LM-1001', subject: 'הדרכה נוספת לצוות המזכירות', category: 'בקשת הדרכה', status: 'closed', who: 'דנה לוי', office: 'משרד לדוגמה ושות׳', assignee: 'עו״ד אסף אברמזון', updated_at: new Date(Date.now() - 86400000 * 16).toISOString(), unread: false }
    ],
    threads: {
      'LM-1005': [{ id: 11, author_type: 'client', author_name: 'יואב כהן', body: 'הצטרפה אלינו עורכת דין חדשה. איך מוסיפים אותה לאזור האישי?', created_at: new Date(Date.now() - 1800000).toISOString() }],
      'LM-1004': [
        { id: 1, author_type: 'client', author_name: 'דנה לוי', body: 'שלום, אצל מיכל במשרד הקונקטור של נבו לא מופיע ברשימת הכלים של Claude, למרות שאצלי הוא עובד.', created_at: new Date(Date.now() - 86400000 * 2).toISOString(), attachment_name: 'צילום-מסך.png', has_file: true },
        { id: 8, author_type: 'staff', author_name: 'עו״ד אסף אברמזון', body: 'כנראה המנוי שלה עוד לא שויך לצוות. לבדוק בהגדרות הארגון לפני השיחה.', internal: true, created_at: new Date(Date.now() - 3600000 * 4).toISOString() },
        { id: 2, author_type: 'staff', author_name: 'עו״ד אסף אברמזון', body: 'תודה דנה, זה מוכר לנו. אפשר לבקש ממיכל לפתוח את Claude ולבדוק ב-Settings תחת Connectors? אם נבו לא מופיע שם, נחבר אותו יחד בשיחה קצרה.', created_at: new Date(Date.now() - 3600000 * 3).toISOString() }
      ],
      'LM-1003': [{ id: 3, author_type: 'client', author_name: 'דנה לוי', body: 'נשמח לסקיל שלוקח פרוטוקול דיון ומוציא ממנו סיכום קצר, מועדים והחלטות.', created_at: new Date(Date.now() - 86400000 * 5).toISOString() }],
      'LM-1001': [{ id: 5, author_type: 'client', author_name: 'דנה לוי', body: 'אפשר לקבוע הדרכה של שעה לצוות המזכירות?', created_at: new Date(Date.now() - 86400000 * 20).toISOString() }, { id: 7, author_type: 'system', author_name: '', body: 'דנה לוי סימנו שהפנייה נפתרה.', created_at: new Date(Date.now() - 86400000 * 16).toISOString() }]
    }
  };
  var T = LM.TICKET, ifilter = 'active', icur = null;
  async function tcall(action, payload) {
    payload = payload || {};
    if (!LM.MOCK) { var r = await LM.fn('tickets-admin', Object.assign({ action: action }, payload)); return r.data || {}; }
    var rows = MT.rows;
    if (action === 'counts') return { open: rows.filter(function (t) { return t.status === 'open'; }).length, unread: rows.filter(function (t) { return t.unread && t.status !== 'closed'; }).length };
    if (action === 'list') return { rows: rows.filter(function (t) { return ifilter === 'all' || (ifilter === 'active' ? (t.status === 'open' || t.status === 'in_progress') : ifilter === 'waiting' ? t.status === 'waiting_client' : t.status === 'closed'); }) };
    var t = rows.find(function (x) { return x.ref === payload.ref; });
    if (!t) return {};
    if (action === 'get') { t.unread = false; return Object.assign({}, t, { email: 'dana@example.com', category_label: t.category, assignee: (MT.staff.find(function (s) { return s.name === t.assignee; }) || {}).id || '', messages: MT.threads[t.ref] || [], staff: MT.staff }); }
    if (action === 'reply') { (MT.threads[t.ref] = MT.threads[t.ref] || []).push({ id: Date.now(), author_type: 'staff', author_name: me.full_name, body: payload.body, internal: payload.internal, created_at: new Date().toISOString() }); if (!payload.internal) t.status = payload.status || 'waiting_client'; t.updated_at = new Date().toISOString(); return { ok: true }; }
    if (action === 'set_status') { t.status = payload.status; if (payload.status === 'closed') (MT.threads[t.ref] = MT.threads[t.ref] || []).push({ author_type: 'system', body: 'הפנייה נסגרה על ידי ' + me.full_name + '.', created_at: new Date().toISOString() }); return { ok: true }; }
    if (action === 'assign') { t.assignee = (MT.staff.find(function (s) { return s.id === payload.assignee; }) || {}).name || ''; if (t.status === 'open' && t.assignee) t.status = 'in_progress'; return { ok: true }; }
    return {};
  }
  async function refreshCounts() {
    var c = await tcall('counts');
    var n = c.open || 0, u = c.unread || 0;
    $('pendingN').textContent = n;
    $('pendingT').textContent = n === 1 ? 'פנייה ממתינה לטיפול' : 'פניות ממתינות לטיפול';
    $('pending').classList.toggle('zero', !n);
    $('tabBadge').textContent = u || n; $('tabBadge').classList.toggle('hide', !(u || n));
  }
  function tchip(st) { return '<span class="chip st-' + E(st) + '">' + E(T.staffStatus[st] || st) + '</span>'; }
  async function drawInboxList() {
    var rows = (await tcall('list', { filter: ifilter })).rows || [];
    var el = document.getElementById('ilist'); if (!el) return;
    el.innerHTML = rows.length ? rows.map(function (t) {
      return '<li><a href="#ticket=' + E(t.ref) + '" aria-current="' + (t.ref === icur) + '"><span class="r1"><span dir="ltr">' + E(t.ref) + '</span>' + tchip(t.status) + '</span><b>' + (t.unread ? '<span class="dot" title="לא נקראה"></span>' : '') + E(t.subject) + '</b><span class="r1"><span>' + E(t.who) + ' · ' + E(t.office) + '</span><span>' + E(LM.when(t.updated_at)) + '</span></span>' + (t.assignee ? '<span class="r1"><span>בטיפול: ' + E(t.assignee) + '</span></span>' : '') + '</a></li>';
    }).join('') : '<li class="quiet" style="padding:14px 12px">אין פניות ברשימה הזו.</li>';
  }
  async function drawTicket(ref) {
    icur = ref; var box = document.getElementById('idet'); if (!box) return;
    box.innerHTML = '<p class="muted">טוען...</p>';
    var t = await tcall('get', { ref: ref });
    if (!t || !t.ref) { box.innerHTML = '<p class="muted">הפנייה לא נמצאה.</p>'; return; }
    var msgs = (t.messages || []).map(function (m) {
      if (m.author_type === 'system') return '<div class="sys">' + E(m.body) + ' · ' + E(LM.when(m.created_at)) + '</div>';
      var cls = m.author_type === 'client' ? 'client' : (m.internal ? 'internal' : 'staff');
      return '<div class="bub ' + cls + '"><div class="meta"><b>' + E(m.author_name) + '</b>' + (m.internal ? '<span>הערה פנימית, הלקוח לא רואה</span>' : '') + '<span>' + E(LM.when(m.created_at)) + '</span></div>' + E(m.body)
        + (m.has_file ? '<div><button class="att" type="button" data-file="' + E(m.id) + '">' + LM.ICONS.clip + E(m.attachment_name || 'קובץ מצורף') + '</button></div>' : '') + '</div>';
    }).join('');
    var staffOpts = '<option value="">ללא שיוך</option>' + (t.staff || []).map(function (s) { return '<option value="' + E(s.id) + '"' + (s.id === t.assignee ? ' selected' : '') + '>' + E(s.name) + '</option>'; }).join('');
    var stOpts = Object.keys(T.staffStatus).map(function (k) { return '<option value="' + k + '"' + (k === t.status ? ' selected' : '') + '>' + E(T.staffStatus[k]) + '</option>'; }).join('');
    box.innerHTML = '<div class="hd"><div><h2>' + E(t.subject) + '</h2><div class="ctl" style="margin-top:8px;color:var(--muted);font-size:14.5px"><span dir="ltr">' + E(t.ref) + '</span>' + tchip(t.status) + '<span>' + E(t.category_label || '') + '</span><span>' + E(t.who) + ' · ' + E(t.office) + '</span></div></div>'
      + '<div class="ctl"><label class="muted" style="font-size:13.5px">שיוך <select id="asg">' + staffOpts + '</select></label><label class="muted" style="font-size:13.5px">מצב <select id="stSel">' + stOpts + '</select></label>' + (t.status !== 'closed' ? '<button class="btn btn-ghost" id="closeT" type="button">סגירת הפנייה</button>' : '') + '</div></div>'
      + '<div class="thread">' + msgs + '</div>'
      + '<form class="composer" id="sf"><div class="mode" role="group" aria-label="סוג הודעה"><button type="button" aria-pressed="true" data-m="reply">תשובה ללקוח</button><button type="button" class="note" aria-pressed="false" data-m="note">הערה פנימית</button></div>'
      + '<textarea id="sb" placeholder="כתבו תשובה ללקוח..." aria-label="תשובה"></textarea>'
      + '<div class="ctl" style="justify-content:space-between"><label class="muted" style="font-size:14px" id="afterL">אחרי השליחה: <select id="after"><option value="waiting_client">ממתינה ללקוח</option><option value="in_progress">נשארת בטיפול</option><option value="closed">נסגרת</option></select></label><button class="btn btn-gold" id="ss">שליחה</button></div><p class="msg" id="smsg" role="status"></p></form>';
    var mode = 'reply';
    box.querySelector('.mode').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return; mode = b.getAttribute('data-m');
      box.querySelectorAll('.mode button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      $('sb').placeholder = mode === 'note' ? 'הערה לצוות בלבד. הלקוח לא יראה אותה.' : 'כתבו תשובה ללקוח...';
      $('afterL').style.visibility = mode === 'note' ? 'hidden' : 'visible'; $('ss').textContent = mode === 'note' ? 'שמירת הערה' : 'שליחה';
    });
    $('sf').addEventListener('submit', async function (e) {
      e.preventDefault(); var body = $('sb').value.trim(); if (!body) return;
      $('ss').disabled = true;
      var r = await tcall('reply', { ref: ref, body: body, internal: mode === 'note', status: $('after').value });
      if (!r.ok) { $('ss').disabled = false; $('smsg').className = 'msg err'; $('smsg').textContent = 'השליחה לא הצליחה.'; return; }
      await refreshCounts(); await drawInboxList(); drawTicket(ref);
    });
    $('asg').addEventListener('change', async function () { await tcall('assign', { ref: ref, assignee: this.value }); await drawInboxList(); drawTicket(ref); });
    $('stSel').addEventListener('change', async function () { await tcall('set_status', { ref: ref, status: this.value }); await refreshCounts(); await drawInboxList(); drawTicket(ref); });
    if ($('closeT')) $('closeT').addEventListener('click', async function () { await tcall('set_status', { ref: ref, status: 'closed' }); await refreshCounts(); await drawInboxList(); drawTicket(ref); });
    box.querySelectorAll('[data-file]').forEach(function (b) {
      b.addEventListener('click', async function () {
        if (LM.MOCK) { alert('בתצוגת הדוגמה אין קובץ אמיתי.'); return; }
        var r = await tcall('file_url', { message_id: Number(b.getAttribute('data-file')) }); if (r.url) location.href = r.url;
      });
    });
    drawInboxList();
  }

  async function load(kind) {
    if (LM.MOCK) return MOCK[kind];
    var r = await LM.fn('admin', { action: 'list_' + kind }); return (r.data && r.data.rows) || [];
  }
  async function act(action, payload) {
    if (LM.MOCK) { $('msg').textContent = 'בתצוגת הדוגמה שום שינוי לא נשמר.'; $('msg').className = 'msg ok'; return true; }
    var r = await LM.fn('admin', Object.assign({ action: action }, payload));
    var ok = !r.error && r.data && r.data.ok;
    $('msg').textContent = ok ? 'נשמר.' : 'השינוי לא נשמר: ' + ((r.data && r.data.error) || 'שגיאה'); $('msg').className = 'msg ' + (ok ? 'ok' : 'err');
    return ok;
  }

  var VIEWS = {
    tickets: async function () {
      setTimeout(async function () {
        document.querySelector('.ifl').addEventListener('click', function (e) {
          var b = e.target.closest('button'); if (!b) return; ifilter = b.getAttribute('data-f');
          document.querySelectorAll('.ifl button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
          drawInboxList();
        });
        await drawInboxList();
        var m = location.hash.match(/ticket=([\w-]+)/);
        if (m) drawTicket(m[1].toUpperCase());
      });
      return '<div class="inbox"><div><div class="ifl" role="group" aria-label="סינון"><button aria-pressed="true" data-f="active">פתוחות</button><button aria-pressed="false" data-f="waiting">ממתינות ללקוח</button><button aria-pressed="false" data-f="closed">סגורות</button><button aria-pressed="false" data-f="all">הכול</button></div><ul class="ilist" id="ilist"></ul></div>'
        + '<div class="idet card" id="idet"><p class="muted">בחרו פנייה מהרשימה כדי לקרוא ולענות.</p></div></div>';
    },
    offices: async function () {
      var rows = await load('offices');
      // the hidden skills office is a storage place, not a client: never offered for reopening here
      var closed = (await load('inactive_offices')).filter(function (o) { return !/^מוסתר/.test(o.name); });
      return '<form class="row-form" data-act="add_office"><div class="field"><label>שם המשרד</label><input name="name" dir="rtl" style="text-align:right" required></div><div class="field"><label>מכסת משתמשים</label><input name="seats" type="number" min="1" value="5" required></div><div class="field"><label>פתוח עד</label><input name="ends_at" type="date"></div><div class="field"><label>מי מלווה את המשרד</label><input name="companion_name" dir="rtl" style="text-align:right" placeholder="למשל: עו״ד אסף אברמזון"></div><button class="btn btn-gold">הוספת משרד</button></form>'
        + '<div class="scroll"><table><thead><tr><th>משרד</th><th>משתמשים</th><th>פתוח עד</th><th>מלווה</th><th></th></tr></thead><tbody>'
        + rows.map(function (o) {
          return '<tr data-row="' + E(o.id) + '"><td><b>' + E(o.name) + '</b></td><td>' + o.used + ' מתוך ' + o.seats + '</td><td>' + E(o.ends_at || '') + '</td><td>' + E(o.companion_name || '') + '</td><td class="acts"><button class="btn btn-ghost" type="button" data-edit="office" data-id="' + E(o.id) + '">עריכה</button> <button class="btn btn-ghost danger" data-a="deactivate_office" data-id="' + E(o.id) + '">סגירת גישה</button></td></tr>'
            + '<tr class="edit-row hide" data-edit-row="' + E(o.id) + '"><td colspan="5"><form class="row-form" data-act="update_office"><input type="hidden" name="id" value="' + E(o.id) + '">'
            + '<div class="field"><label>שם המשרד</label><input name="name" dir="rtl" style="text-align:right" value="' + E(o.name) + '" required></div>'
            + '<div class="field"><label>מכסת משתמשים</label><input name="seats" type="number" min="' + Math.max(1, o.used) + '" value="' + o.seats + '" required></div>'
            + '<div class="field"><label>פתוח עד (ריק = בלי הגבלה)</label><input name="ends_at" type="date" value="' + E(o.ends_at || '') + '"></div>'
            + '<div class="field"><label>מי מלווה את המשרד</label><input name="companion_name" dir="rtl" style="text-align:right" value="' + E(o.companion_name || '') + '"></div>'
            + '<button class="btn btn-gold">שמירה</button><button class="btn btn-ghost" type="button" data-cancel="' + E(o.id) + '">ביטול</button></form></td></tr>';
        }).join('') + '</tbody></table></div>'
        + (closed.length ? '<h3 class="sub-h">משרדים שהגישה שלהם נסגרה</h3><div class="scroll"><table><thead><tr><th>משרד</th><th>מכסה</th><th>פתוח עד</th><th></th></tr></thead><tbody>'
          + closed.map(function (o) { return '<tr><td><b>' + E(o.name) + '</b></td><td>' + o.seats + '</td><td>' + E(o.ends_at || '') + '</td><td><button class="btn btn-ghost" data-a="reactivate_office" data-id="' + E(o.id) + '" data-confirm="לפתוח מחדש את הגישה של ' + E(o.name) + '? העובדים לא חוזרים אוטומטית: מחזירים כל אחד בלשונית משתמשים.">פתיחה מחדש</button></td></tr>'; }).join('') + '</tbody></table></div>' : '');
    },
    members: async function () {
      var rows = await load('members'), offs = await load('offices'), removed = await load('removed');
      return '<form class="row-form" data-act="add_member"><div class="field"><label>משרד</label><select name="office_id" dir="rtl" style="text-align:right">' + offs.map(function (o) { return '<option value="' + E(o.id) + '">' + E(o.name) + '</option>'; }).join('') + '</select></div><div class="field"><label>שם מלא</label><input name="full_name" dir="rtl" style="text-align:right" required></div><div class="field"><label>מייל</label><input name="email" type="email" required></div><button class="btn btn-gold">הוספת משתמש</button></form>'
        + '<div class="scroll"><table><thead><tr><th>שם</th><th>משרד</th><th>מייל</th><th>מכשירים</th><th>כניסה אחרונה</th><th></th></tr></thead><tbody>'
        + rows.map(function (m) {
          return '<tr data-row="' + E(m.id) + '"><td><b>' + E(m.name) + '</b></td><td>' + E(m.office) + '</td><td dir="ltr" style="text-align:right">' + E(m.email) + '</td><td>' + m.devices + '/2</td><td>' + E(m.last || '') + '</td><td class="acts"><button class="btn btn-ghost" type="button" data-edit="member" data-id="' + E(m.id) + '">תיקון שם</button> <button class="btn btn-ghost danger" data-a="remove_member" data-id="' + E(m.id) + '">הסרה וניתוק</button></td></tr>'
            + '<tr class="edit-row hide" data-edit-row="' + E(m.id) + '"><td colspan="6"><form class="row-form" data-act="update_member"><input type="hidden" name="id" value="' + E(m.id) + '">'
            + '<div class="field"><label>שם מלא</label><input name="full_name" dir="rtl" style="text-align:right" value="' + E(m.name) + '" required></div>'
            + '<button class="btn btn-gold">שמירה</button><button class="btn btn-ghost" type="button" data-cancel="' + E(m.id) + '">ביטול</button></form></td></tr>';
        }).join('') + '</tbody></table></div>'
        + (removed.length ? '<h3 class="sub-h">עובדים שהוסרו</h3><p class="muted" style="margin:0 0 var(--s2)">החזרה מחזירה את הגישה עם אותו מייל. העובד נכנס מחדש עם קוד למייל. צריך מקום פנוי במכסה של המשרד.</p><div class="scroll"><table><thead><tr><th>שם</th><th>משרד</th><th>מייל</th><th></th></tr></thead><tbody>'
          + removed.map(function (m) { return '<tr><td><b>' + E(m.name) + '</b></td><td>' + E(m.office) + (m.office_active ? '' : ' <span class="muted">(הגישה של המשרד סגורה)</span>') + '</td><td dir="ltr" style="text-align:right">' + E(m.email) + '</td><td><button class="btn btn-ghost" data-a="restore_member" data-id="' + E(m.id) + '" data-confirm="להחזיר את ' + E(m.name) + ' לאזור האישי?">החזרה</button></td></tr>'; }).join('') + '</tbody></table></div>' : '');
    },
    content: async function () {
      var rows = await load('content');
      return '<p class="muted" style="margin:0 0 var(--s3)">הקבצים עצמם נשמרים באחסון הסגור. כאן רואים כל פריט ולמי הוא פתוח.</p>' + (rows.length ? '' : '<p class="quiet">עוד לא עלו תכנים.</p>') + '<div class="scroll"><table><thead><tr><th>פריט</th><th>סוג</th><th>פתוח ל</th></tr></thead><tbody>'
        + rows.map(function (c) { return '<tr><td><b>' + E(c.title) + '</b></td><td>' + E(c.kind) + '</td><td>' + E(c.scope) + '</td></tr>'; }).join('') + '</tbody></table></div>';
    },
    log: async function () {
      var rows = await load('log');
      return '<div class="scroll"><table><thead><tr><th>מתי</th><th>מי</th><th>משרד</th><th>מה</th><th>מכשיר</th><th>כתובת</th></tr></thead><tbody>'
        + rows.map(function (l) { return '<tr><td>' + E(l.at) + '</td><td><b>' + E(l.who) + '</b></td><td>' + E(l.office) + '</td><td>' + E(l.what) + '</td><td dir="ltr" style="text-align:right">' + E(l.device) + '</td><td dir="ltr" style="text-align:right">' + E(l.ip) + '</td></tr>'; }).join('') + '</tbody></table></div>';
    },
    alerts: async function () {
      var rows = await load('alerts');
      return rows.length ? '<div class="scroll"><table><thead><tr><th>מתי</th><th>מי</th><th>מה קרה</th><th>מצב</th></tr></thead><tbody>'
        + rows.map(function (a) { return '<tr><td>' + E(a.at) + '</td><td><b>' + E(a.who) + '</b></td><td class="alert">' + E(a.what) + '</td><td>' + E(a.status) + '</td></tr>'; }).join('') + '</tbody></table></div>' : '<p class="quiet">אין התראות. כל הכניסות נראות תקינות.</p>';
    }
  };
  var current = 'offices';
  async function show(t) { current = t; $('pane').innerHTML = '<p class="muted">טוען...</p>'; $('pane').innerHTML = await VIEWS[t](); }
  document.querySelector('.tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    document.querySelectorAll('.tabs button').forEach(function (x) { x.setAttribute('aria-selected', String(x === b)); });
    show(b.getAttribute('data-t'));
  });
  $('pane').addEventListener('submit', async function (e) {
    e.preventDefault(); var f = e.target, data = {};
    new FormData(f).forEach(function (v, k) { data[k] = v; });
    if (await act(f.getAttribute('data-act'), data)) show(current);
  });
  $('pane').addEventListener('click', async function (e) {
    var ed = e.target.closest('[data-edit]'), cn = e.target.closest('[data-cancel]');
    if (ed || cn) {
      var id = (ed || cn).getAttribute(ed ? 'data-id' : 'data-cancel');
      var er = document.querySelector('[data-edit-row="' + id + '"]'), r = document.querySelector('[data-row="' + id + '"]');
      if (er) er.classList.toggle('hide', !ed);
      if (r) r.classList.toggle('hide', !!ed);
      if (ed && er) { var inp = er.querySelector('input:not([type=hidden])'); if (inp) inp.focus(); }
      return;
    }
    var b = e.target.closest('[data-a]'); if (!b) return;
    if (!confirm(b.getAttribute('data-confirm') || 'לבצע? הפעולה מנתקת את הגישה מיד.')) return;
    if (await act(b.getAttribute('data-a'), { id: b.getAttribute('data-id') })) show(current);
  });
  window.addEventListener('hashchange', function () {
    var m = location.hash.match(/ticket=([\w-]+)/);
    if (m) { if (current !== 'tickets') selectTab('tickets'); else drawTicket(m[1].toUpperCase()); }
    else if (location.hash === '#tickets') selectTab('tickets');
  });
  function selectTab(t) {
    document.querySelectorAll('.tabs button').forEach(function (x) { x.setAttribute('aria-selected', String(x.getAttribute('data-t') === t)); });
    show(t);
  }
  refreshCounts();
  selectTab('tickets');
})();
</script>
</body>
</html>
