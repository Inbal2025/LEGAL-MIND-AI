<style>
:root{
  --bg:#07130F;--bg-2:#0B1B16;--bg-3:#0F241E;
  --ink:#F3F0E8;--ink-2:#C3CCC7;--ink-3:#8FA09A;
  --teal:#63C2B8;--teal-l:#96E0D6;--teal-d:#1D7A70;
  --nevo-b:#BE2B30;
  --hair:rgba(243,240,232,.09);--hair-2:rgba(243,240,232,.16);
  --serif:"Heebo","Assistant",system-ui,sans-serif;--sans:"Assistant",system-ui,sans-serif;--mono:"IBM Plex Mono",Consolas,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:clip;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding-inline:clamp(16px,4vw,40px)}

/* hero */
.hero{position:relative;padding:clamp(22px,4vw,34px) 0 clamp(40px,6vw,70px);overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:url(/nevo/office-bg.jpg) center/cover no-repeat;opacity:.38;z-index:-2}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,19,15,.55) 0%,rgba(7,19,15,.75) 60%,var(--bg) 100%);z-index:-1}
@media (max-width:700px){.hero::before{background-image:url(/nevo/office-bg-mobile.jpg)}}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px}
.back{font-weight:700;font-size:.95rem;color:var(--teal-l);text-decoration:none}
.back:hover{text-decoration:underline}
.cubes{display:flex;justify-content:center;gap:14px;margin:clamp(24px,4vw,36px) 0 18px}
.cube{background:#fff;border-radius:18px;height:clamp(70px,9vw,92px);padding:0 clamp(16px,2.4vw,26px);display:grid;place-items:center;box-shadow:0 14px 34px rgba(0,0,0,.4)}
.cube img{display:block;height:clamp(26px,3.4vw,36px);width:auto}
.cube.nv img{height:clamp(34px,4.4vw,48px)}
.hub{text-align:center;font-family:"Bona Nova","Frank Ruhl Libre",Georgia,serif;font-size:clamp(1.15rem,2vw,1.45rem);color:var(--ink-2);margin-bottom:10px}
.hub em{font-style:normal}.hub .lm{color:var(--teal)}.hub .nv{color:var(--nevo-b)}
h1{margin:0 auto 14px;max-width:46rem;text-align:center;font-family:var(--serif);font-weight:800;font-size:clamp(2rem,4.8vw,3.3rem);line-height:1.12;letter-spacing:-.01em;text-wrap:balance}
h1 em{font-style:normal;color:var(--teal-l)}
.lede{margin:0 auto;max-width:44rem;text-align:center;color:var(--ink-2);font-size:clamp(1.05rem,1.5vw,1.2rem);text-wrap:balance}
.pick{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:26px}
.pick a{display:inline-flex;align-items:center;gap:10px;height:52px;padding:0 22px;border-radius:13px;font-weight:800;font-size:1.05rem;text-decoration:none;color:#fff;background:linear-gradient(135deg,#0F8A7C,#0A6459);box-shadow:0 5px 0 #063c35,0 14px 30px rgba(0,0,0,.4);transition:transform .15s ease,box-shadow .15s ease}
.pick a small{font-weight:600;opacity:.8;font-size:.82rem;direction:ltr;unicode-bidi:isolate}
.pick a:hover{transform:translateY(-2px);box-shadow:0 7px 0 #063c35,0 18px 36px rgba(0,0,0,.45)}
.pick a:active{transform:translateY(3px);box-shadow:0 2px 0 #063c35,0 8px 16px rgba(0,0,0,.35)}

/* before you start */
.prep{margin:clamp(10px,2vw,20px) auto clamp(34px,5vw,56px);max-width:900px;padding:clamp(18px,2.6vw,26px);border-radius:20px;border:1px solid rgba(99,194,184,.25);background:rgba(99,194,184,.06)}
.prep h2{margin:0 0 12px;font-family:var(--serif);font-weight:800;font-size:clamp(1.2rem,2vw,1.45rem)}
.prep ul{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.prep li{display:flex;gap:10px;align-items:flex-start;color:var(--ink-2);font-size:1rem;line-height:1.5}
.prep li i{flex:none;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-style:normal;font-weight:800;color:#06222a;background:var(--teal-l);font-size:.9rem}
.prep li b{color:var(--ink)}

/* guide cards */
.guides{display:grid;grid-template-columns:1fr 1fr;gap:clamp(16px,2.4vw,26px);align-items:start}
.card{scroll-margin-top:20px;border-radius:22px;border:1px solid rgba(99,194,184,.28);background:linear-gradient(160deg,rgba(15,36,30,.95),rgba(7,19,15,.95));padding:clamp(22px,3vw,32px);box-shadow:0 30px 70px rgba(0,0,0,.45)}
.card:target{border-color:rgba(150,224,214,.7);box-shadow:0 0 0 2px rgba(150,224,214,.25),0 30px 70px rgba(0,0,0,.45)}
.tag{display:inline-block;font-size:.85rem;font-weight:800;color:#06222a;background:var(--teal-l);border-radius:999px;padding:2px 12px;margin-bottom:10px}
.card h2{margin:0;font-family:var(--serif);font-weight:800;font-size:clamp(1.55rem,2.6vw,1.95rem);line-height:1.2}
.plan{color:var(--ink-3);font-size:.98rem;margin:2px 0 12px}
.card > p{margin:0 0 18px;color:var(--ink-2)}
.part{margin:18px 0 8px;display:inline-block;font-size:.85rem;font-weight:800;color:var(--teal-l);border:1px solid rgba(150,224,214,.4);border-radius:999px;padding:1px 12px}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:0 0 14px 0;padding-inline-start:44px;color:var(--ink-2);line-height:1.55;font-size:1rem}
ol.steps li::before{content:counter(s);position:absolute;inset-inline-start:0;top:-1px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.9rem;color:var(--teal-l);background:rgba(99,194,184,.12);border:1px solid rgba(99,194,184,.4)}
ol.steps li:not(:last-child)::after{content:"";position:absolute;inset-inline-start:14.5px;top:32px;bottom:2px;width:1px;background:rgba(99,194,184,.25)}
ol.steps b{color:var(--ink)}
code{font-family:var(--mono);font-size:.88em;background:rgba(243,240,232,.08);border:1px solid var(--hair-2);border-radius:6px;padding:0 6px;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.copy{margin:6px 0 20px;display:grid;gap:8px}
.cp{display:flex;align-items:center;gap:10px;justify-content:space-between;width:100%;min-width:0;padding:9px 12px;border-radius:11px;border:1px solid var(--hair-2);background:rgba(243,240,232,.04);color:var(--ink);font:inherit;cursor:pointer;text-align:start}
.cp:hover{border-color:rgba(150,224,214,.5)}
.cp span{flex:none;color:var(--ink-3);font-size:.9rem}
.cp code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;background:none;border:0;padding:0;text-align:left}
.cp em{flex:none;font-style:normal;font-weight:800;font-size:.88rem;color:var(--teal-l)}
.cp.ok{border-color:#3fae7c}.cp.ok em{color:#7fe0b0}
.acts{display:grid;gap:10px;margin-top:6px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:10px 18px;border-radius:13px;font-weight:800;font-size:1.03rem;text-decoration:none;text-align:center;transition:transform .15s ease,box-shadow .15s ease,background .15s ease}
.btn.main{color:#fff;background:linear-gradient(135deg,#0F8A7C,#0A6459);box-shadow:0 5px 0 #063c35,0 14px 30px rgba(0,0,0,.4)}
.btn.main:hover{transform:translateY(-2px);box-shadow:0 7px 0 #063c35,0 18px 36px rgba(0,0,0,.45)}
.btn.main:active{transform:translateY(3px);box-shadow:0 2px 0 #063c35,0 8px 16px rgba(0,0,0,.35)}
.btn.pdf{color:var(--ink);background:rgba(243,240,232,.05);border:1px solid var(--hair-2)}
.btn.pdf:hover{background:rgba(243,240,232,.1)}
.nvb{font-size:.78rem;font-weight:800;color:#fff;background:var(--nevo-b);border-radius:6px;padding:1px 7px}
.sub-link{display:block;text-align:center;font-weight:700;font-size:.95rem;color:var(--teal-l);margin-top:2px}
.btn:focus-visible,.pick a:focus-visible,.cp:focus-visible{outline:3px solid var(--teal-l);outline-offset:3px}

/* tips + cta */
.tips{margin:clamp(34px,5vw,56px) auto 0;max-width:900px}
.tips h2{margin:0 0 14px;text-align:center;font-family:var(--serif);font-weight:800;font-size:clamp(1.35rem,2.4vw,1.75rem)}
.tips details{border:1px solid var(--hair-2);border-radius:14px;background:rgba(243,240,232,.03);margin-bottom:10px}
.tips summary{cursor:pointer;list-style:none;padding:14px 18px;font-weight:800;display:flex;justify-content:space-between;gap:12px}
.tips summary::-webkit-details-marker{display:none}
.tips summary::after{content:"+";color:var(--teal-l);font-size:1.3rem;line-height:1}
.tips details[open] summary::after{content:"−"}
.tips details p{margin:0;padding:0 18px 16px;color:var(--ink-2)}
.cta{margin:clamp(34px,5vw,56px) auto clamp(40px,6vw,70px);max-width:900px;text-align:center;padding:clamp(24px,3.6vw,38px);border-radius:22px;border:1px solid rgba(150,224,214,.32);background:linear-gradient(160deg,rgba(15,36,30,.9),rgba(7,19,15,.9));box-shadow:0 30px 80px rgba(0,0,0,.5),0 0 120px rgba(99,194,184,.1)}
.cta h2{margin:0 0 8px;font-family:var(--serif);font-weight:800;font-size:clamp(1.4rem,2.6vw,1.9rem)}
.cta p{margin:0 auto 18px;max-width:38rem;color:var(--ink-2)}
.cta .btn{display:inline-flex;padding:0 26px}
footer{border-top:1px solid var(--hair);padding:22px 0 30px;text-align:center;color:var(--ink-3);font-size:.9rem}
footer a{color:var(--teal-l);font-weight:700;text-decoration:none}

@media (max-width:820px){.guides{grid-template-columns:1fr}.prep ul{grid-template-columns:1fr}}
@media (max-width:520px){.bar{flex-direction:column;align-items:flex-start}.pick a{flex:1;flex-direction:column;justify-content:center;gap:0;height:auto;min-height:58px;padding:8px 10px;line-height:1.25}.pick a small{white-space:nowrap}.cube{border-radius:14px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn,.pick a{transition:none}}
.links{display:grid;grid-template-columns:1fr 1fr;gap:clamp(14px,2.4vw,24px);max-width:820px;margin:0 auto clamp(50px,8vw,90px)}
.gl{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:clamp(22px,3vw,30px);border-radius:20px;text-decoration:none;color:var(--ink);border:1px solid rgba(99,194,184,.3);background:linear-gradient(160deg,rgba(15,36,30,.95),rgba(7,19,15,.95));box-shadow:0 5px 0 rgba(6,40,34,.9),0 22px 50px rgba(0,0,0,.45);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.gl:hover{transform:translateY(-3px);border-color:rgba(150,224,214,.6);box-shadow:0 8px 0 rgba(6,40,34,.9),0 28px 58px rgba(0,0,0,.5)}
.gl:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(6,40,34,.9),0 10px 22px rgba(0,0,0,.35)}
.gl:focus-visible{outline:3px solid var(--teal-l);outline-offset:4px}
.gl-t{font-family:var(--serif);font-weight:800;font-size:clamp(1.5rem,2.6vw,1.9rem);line-height:1.2}
.gl-p{color:var(--ink-3);font-size:.98rem}
.gl-d{color:var(--ink-2);margin:6px 0 14px}
.gl-go{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 22px;border-radius:12px;font-weight:800;color:#fff;background:linear-gradient(135deg,#0F8A7C,#0A6459);box-shadow:0 4px 0 #063c35}
@media (max-width:700px){.links{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.gl{transition:none}}
</style>
</head>
